name: Tests
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install PHP extensions
        run: sudo apt-get update && sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-curl
      - name: Test
        run: sh tests/run.sh
